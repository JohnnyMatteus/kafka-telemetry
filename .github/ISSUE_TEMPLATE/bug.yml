name: Bug
description: Algo no pipeline não se comporta como documentado
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: Comportamento observado, com logs ou métricas relevantes.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Como reproduzir
      description: Comandos (make up, simulador com quais flags, etc.).
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Componente
      options: [simulador, agregador, schemas, kafka-connect, infraestrutura, outro]
    validations:
      required: true
  - type: dropdown
    id: guarantee
    attributes:
      label: Afeta garantia de entrega ou contrato?
      options: [não, perda de dados, duplicidade, quebra de schema, não sei]
