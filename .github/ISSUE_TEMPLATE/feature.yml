name: Melhoria
description: Proponha uma capacidade nova para o pipeline
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema de negócio
      description: Que dor da operação das estufas isso resolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Impacto em contratos e garantias
      description: Muda algum schema? Muda a semântica de entrega?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
