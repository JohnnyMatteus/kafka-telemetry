global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo.yml

scrape_configs:
  - job_name: simulator
    static_configs:
      - targets: ["simulator:9101"]
  - job_name: aggregator
    static_configs:
      - targets: ["aggregator:9102"]
  - job_name: notifier
    static_configs:
      - targets: ["notifier:9103"]
