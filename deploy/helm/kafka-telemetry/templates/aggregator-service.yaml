apiVersion: v1
kind: Service
metadata:
  name: {{ include "kt.fullname" . }}-aggregator
  labels:
    {{- include "kt.labels" . | nindent 4 }}
    app.kubernetes.io/component: aggregator
spec:
  selector:
    {{- include "kt.selector" . | nindent 4 }}
    app.kubernetes.io/component: aggregator
  ports:
    - name: http
      port: 9102
      targetPort: http
