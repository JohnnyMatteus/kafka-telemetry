# Ambiente local do pipeline de telemetria. Senhas e chaves são só de desenvolvimento.
# Use o Makefile (make up, make ps, make logs, make down) ou, direto:
#   docker compose --profile core --profile observability up -d --build
# Profiles:
#   core           Kafka (KRaft), Schema Registry, Connect, Postgres, MinIO, Redis, init, simulador e agregador
#   observability  Prometheus, Grafana (dashboards e SLOs) e Jaeger
#   tools          Kafka UI
#   secure         Kafka com TLS+mTLS, SASL e ACLs por serviço e Schema Registry autenticado
#                  (make secure-init e make up-secure; exclui Connect, MinIO, web e observabilidade)
name: kafka-telemetry

x-app-env: &app-env
  KAFKA_BROKERS: kafka:29092
  SCHEMA_REGISTRY_URL: http://schema-registry:8081
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.05}

# Cliente seguro: o certificado, a chave e as senhas ficam em .secure/ (make
# secure-init), montado em /etc/secure; aqui só há caminhos, nunca segredo.
x-secure-client-env: &secure-client-env
  KAFKA_BROKERS: kafka-secure:29092
  KAFKA_TLS_CA_FILE: /etc/secure/ca.crt
  KAFKA_SASL_MECHANISM: PLAIN
  SCHEMA_REGISTRY_URL: https://schema-registry-secure:8081
  SCHEMA_REGISTRY_CA_FILE: /etc/secure/ca.crt
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

networks:
  telemetry-net:
    name: telemetry-net

volumes:
  kafka-data:
  kafka-secure-data:
  pgdata:
  minio-data:
  redis-data:
  prometheus-data:

services:
  kafka:
    profiles: ["core"]
    image: confluentinc/cp-kafka:7.9.1
    hostname: kafka
    networks: [telemetry-net]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      # KRaft: um nó que é broker e controller ao mesmo tempo, sem ZooKeeper.
      CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Heap pequeno: a ferramenta do healthcheck herdaria KAFKA_HEAP_OPTS do broker.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      start_period: 20s
      interval: 10s
      timeout: 20s
      retries: 30
    deploy:
      resources:
        limits: { memory: 1536m }

  schema-registry:
    profiles: ["core"]
    image: confluentinc/cp-schema-registry:7.9.1
    hostname: schema-registry
    networks: [telemetry-net]
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { memory: 512m }

  postgres:
    profiles: ["core", "secure"]
    image: postgres:16-alpine
    networks: [telemetry-net]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Object storage compatível com S3: data lake da telemetria bruta (ver ADR 0007).
  minio:
    profiles: ["core"]
    image: bitnamilegacy/minio:2024.12.18
    networks: [telemetry-net]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev-only-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-only-change-me}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-agrovale-telemetry-raw}
    # A imagem para e reinicia o servidor depois de criar o bucket; em máquinas
    # lentas o segundo start pode encontrar a porta ainda ocupada.
    restart: unless-stopped
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Projeção do último estado de cada estufa, gravada pelo agregador.
  redis:
    profiles: ["core", "secure"]
    image: redis:7.4.6-alpine
    networks: [telemetry-net]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  connect:
    profiles: ["core"]
    build: ./connect
    image: kafka-telemetry-connect:local
    hostname: connect
    networks: [telemetry-net]
    depends_on:
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports:
      - "${CONNECT_PORT:-8083}:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: greenhouse-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_HEAP_OPTS: "-Xms768m -Xmx768m"
      # Só o conversor Avro e os conectores instalados: varrer /usr/share/java
      # inteiro leva minutos na inicialização.
      CONNECT_PLUGIN_PATH: /usr/share/java/kafka-serde-tools,/usr/share/confluent-hub-components
      # Segredos dos conectores vêm do ambiente, não do JSON versionado.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      JDBC_SINK_USER: telemetry
      JDBC_SINK_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      S3_BUCKET: ${S3_BUCKET:-agrovale-telemetry-raw}
      S3_ENDPOINT: http://minio:9000
      # Cadeia padrão de credenciais da AWS: na nuvem, troque por IAM role.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dev-only-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev-only-change-me}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { memory: 2g }

  # Cria tópicos e registra os schemas com compatibilidade BACKWARD.
  init:
    profiles: ["core"]
    image: kafka-telemetry:local
    build: .
    command: ["telemetryctl", "init"]
    networks: [telemetry-net]
    environment: *app-env
    depends_on:
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
    restart: "no"

  connectors:
    profiles: ["core"]
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/scripts/deploy-connectors.sh", "/connect"]
    networks: [telemetry-net]
    environment:
      CONNECT_URL: http://connect:8083
    volumes:
      - ./scripts/deploy-connectors.sh:/scripts/deploy-connectors.sh:ro
      - ./connect:/connect:ro
    depends_on:
      connect: { condition: service_healthy }
      init: { condition: service_completed_successfully }
    restart: "no"

  simulator:
    profiles: ["core"]
    image: kafka-telemetry:local
    command: ["simulator"]
    networks: [telemetry-net]
    environment:
      <<: *app-env
      SIM_GREENHOUSES: ${SIM_GREENHOUSES:-20}
      SIM_RATE: ${SIM_RATE:-80}
    ports:
      - "${SIMULATOR_METRICS_PORT:-9101}:9101"
    depends_on:
      init: { condition: service_completed_successfully }
    restart: unless-stopped

  aggregator:
    profiles: ["core"]
    image: kafka-telemetry:local
    command: ["aggregator"]
    networks: [telemetry-net]
    environment:
      <<: *app-env
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://telemetry:${POSTGRES_PASSWORD:-dev-only-change-me}@postgres:5432/telemetry
      OPERATOR_TOKENS: ${OPERATOR_TOKENS:-ana:dev-only-token-ana,bruno:dev-only-token-bruno}
      DLQ_REPLAY_TOPIC: ${DLQ_REPLAY_TOPIC:-greenhouse.readings}
      DLQ_REPLAY_MAX_BATCH: ${DLQ_REPLAY_MAX_BATCH:-100}
      WINDOW_SIZE: ${WINDOW_SIZE:-1m}
      WATERMARK_SCOPE: ${WATERMARK_SCOPE:-greenhouse}
      WATERMARK_IDLE_TIMEOUT: ${WATERMARK_IDLE_TIMEOUT:-2m}
      THRESHOLD_TEMPERATURE_MIN: ${THRESHOLD_TEMPERATURE_MIN:-12}
      THRESHOLD_TEMPERATURE_MAX: ${THRESHOLD_TEMPERATURE_MAX:-32}
      THRESHOLD_HUMIDITY_MIN: ${THRESHOLD_HUMIDITY_MIN:-50}
      THRESHOLD_HUMIDITY_MAX: ${THRESHOLD_HUMIDITY_MAX:-90}
      THRESHOLD_CO2_MIN: ${THRESHOLD_CO2_MIN:-350}
      THRESHOLD_CO2_MAX: ${THRESHOLD_CO2_MAX:-1500}
      THRESHOLD_LUMINOSITY_MIN: ${THRESHOLD_LUMINOSITY_MIN:-0}
      THRESHOLD_LUMINOSITY_MAX: ${THRESHOLD_LUMINOSITY_MAX:-80000}
    ports:
      - "${AGGREGATOR_METRICS_PORT:-9102}:9102"
    depends_on:
      init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  mailpit:
    profiles: ["core", "secure"]
    image: axllent/mailpit:v1.21.8
    networks: [telemetry-net]
    # Só a UI é publicada, e só no loopback: o SMTP (1025) fica na rede do
    # compose, porque o Mailpit aceita qualquer remetente e destinatário.
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  notifier:
    profiles: ["core"]
    image: kafka-telemetry:local
    command: ["notifier"]
    networks: [telemetry-net]
    environment:
      <<: *app-env
      REDIS_ADDR: redis:6379
      NOTIFY_RECIPIENTS_FILE: /etc/notifier/recipients.json
      NOTIFY_SMTP_ADDR: mailpit:1025
      NOTIFY_SMTP_FROM: alertas@example.com
      NOTIFY_WEBHOOK_ALLOW_HTTP: ${NOTIFY_WEBHOOK_ALLOW_HTTP:-false}
    volumes:
      - ./deploy/notifier:/etc/notifier:ro
    ports:
      - "127.0.0.1:${NOTIFIER_METRICS_PORT:-9103}:9103"
    depends_on:
      init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    restart: unless-stopped

  # ---- profile secure (ADR 0016): nada aqui roda sem `make secure-init` ----
  kafka-secure:
    profiles: ["secure"]
    image: confluentinc/cp-kafka:7.9.1
    hostname: kafka-secure
    networks: [telemetry-net]
    # Sem portas publicadas: só a rede do compose alcança o broker.
    environment:
      CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-secure:29093
      # O nome do listener é SASL_SSL de propósito: o script configure da imagem
      # cp-kafka só lê KAFKA_SSL_*_FILENAME/_CREDENTIALS se KAFKA_ADVERTISED_LISTENERS
      # contém "SSL://" (e só valida o JAAS com "SASL_...://"); com um nome
      # como INTERNAL o broker subiria sem keystore.
      KAFKA_LISTENERS: SASL_SSL://0.0.0.0:29092,CONTROLLER://kafka-secure:29093
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka-secure:29092
      # Os dois listeners exigem TLS, certificado de cliente (mTLS) e SASL.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_SSL:SASL_SSL,CONTROLLER:SASL_SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      # mTLS: em listener SASL_SSL o broker IGNORA o ssl.client.auth global e o trata
      # como "none" (ChannelBuilders, Kafka 3.9.0: "SSL client authentication is enabled
      # in brokers for SASL_SSL only if listener-prefixed config is specified"). Só vale
      # listener.name.<listener>.ssl.client.auth. A imagem converte "_" em "." e "__" em
      # "_" (confluent-docker-utils, env_to_props), então SASL__SSL vira sasl_ssl.
      KAFKA_LISTENER_NAME_SASL__SSL_SSL_CLIENT_AUTH: required
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_CLIENT_AUTH: required
      KAFKA_SSL_KEYSTORE_FILENAME: kafka-secure.keystore.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: truststore.p12
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      # ACLs: negado por padrão; broker e ops são superusuários.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: User:broker;User:ops
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-secure-data:/var/lib/kafka/data
      - ./.secure/broker:/etc/kafka/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m kafka-broker-api-versions --bootstrap-server kafka-secure:29092 --command-config /etc/kafka/secrets/broker.properties >/dev/null 2>&1"]
      start_period: 30s
      interval: 10s
      timeout: 20s
      retries: 30
    deploy:
      resources:
        limits: { memory: 1536m }

  # Registry com HTTPS e login HTTP basic (um usuário por serviço). O basic
  # autentica; não separa leitura de escrita (isso exige o plugin de segurança
  # do Confluent). O registry fala com o Kafka com o usuário `schemaregistry`.
  schema-registry-secure:
    profiles: ["secure"]
    image: confluentinc/cp-schema-registry:7.9.1
    hostname: schema-registry-secure
    networks: [telemetry-net]
    depends_on:
      kafka-secure: { condition: service_healthy }
      # As ACLs do usuário schemaregistry (criar _schemas, ler o grupo) têm de existir
      # antes de o registry subir.
      acls-secure: { condition: service_completed_successfully }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry-secure
      SCHEMA_REGISTRY_LISTENERS: https://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms256m -Xmx256m"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-secure:29092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_SSL
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: PLAIN
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_LOCATION: /etc/schema-registry/secrets/truststore.p12
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_PASSWORD: ${SECURE_STORE_PASSWORD:-}
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEYSTORE_LOCATION: /etc/schema-registry/secrets/schemaregistry.keystore.p12
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEYSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEYSTORE_PASSWORD: ${SECURE_STORE_PASSWORD:-}
      SCHEMA_REGISTRY_SSL_KEYSTORE_LOCATION: /etc/schema-registry/secrets/schema-registry-secure.keystore.p12
      SCHEMA_REGISTRY_SSL_KEYSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_SSL_KEYSTORE_PASSWORD: ${SECURE_STORE_PASSWORD:-}
      SCHEMA_REGISTRY_SSL_KEY_PASSWORD: ${SECURE_STORE_PASSWORD:-}
      SCHEMA_REGISTRY_AUTHENTICATION_METHOD: BASIC
      SCHEMA_REGISTRY_AUTHENTICATION_REALM: SchemaRegistry
      SCHEMA_REGISTRY_AUTHENTICATION_ROLES: admin
      # O JAAS precisa de DUAS variáveis: a imagem espera o Kafka com `cub kafka-ready
      # --config admin.properties` (script ensure), e o cub só repassa KAFKA_OPTS à
      # JVM; SCHEMA_REGISTRY_OPTS vale só para o processo do registry. O
      # admin.properties vem de SCHEMA_REGISTRY_KAFKASTORE_* (inclui o keystore do mTLS).
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/schema-registry/secrets/registry_jaas.conf
      SCHEMA_REGISTRY_OPTS: -Djava.security.auth.login.config=/etc/schema-registry/secrets/registry_jaas.conf
      # Só há listener https: as chamadas entre instâncias também (e usam este truststore).
      SCHEMA_REGISTRY_INTER_INSTANCE_PROTOCOL: https
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_LOCATION: /etc/schema-registry/secrets/truststore.p12
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_PASSWORD: ${SECURE_STORE_PASSWORD:-}
    volumes:
      - ./.secure/registry:/etc/schema-registry/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert /etc/schema-registry/secrets/ca.crt -u healthcheck:$$(cat /etc/schema-registry/secrets/registry-healthcheck.password) https://schema-registry-secure:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { memory: 512m }

  # Cria as ACLs e depois os tópicos, com o usuário `ops`.
  acls-secure:
    profiles: ["secure"]
    image: confluentinc/cp-kafka:7.9.1
    networks: [telemetry-net]
    entrypoint: ["bash", "/deploy/acls.sh"]
    environment:
      KAFKA_HEAP_OPTS: "-Xmx128m"
    volumes:
      - ./deploy/secure:/deploy:ro
      - ./.secure/ops:/etc/kafka/secrets:ro
    depends_on:
      kafka-secure: { condition: service_healthy }
    restart: "no"

  init-secure:
    profiles: ["secure"]
    image: kafka-telemetry:local
    build: .
    command: ["telemetryctl", "init"]
    networks: [telemetry-net]
    environment:
      <<: *secure-client-env
      KAFKA_TLS_CERT_FILE: /etc/secure/ops.crt
      KAFKA_TLS_KEY_FILE: /etc/secure/ops.key
      KAFKA_SASL_USER: ops
      KAFKA_SASL_PASSWORD_FILE: /etc/secure/ops.password
      SCHEMA_REGISTRY_USER: ops
      SCHEMA_REGISTRY_PASSWORD_FILE: /etc/secure/registry-ops.password
    volumes:
      - ./.secure/ops:/etc/secure:ro
    depends_on:
      acls-secure: { condition: service_completed_successfully }
      schema-registry-secure: { condition: service_healthy }
    restart: "no"

  simulator-secure:
    profiles: ["secure"]
    image: kafka-telemetry:local
    command: ["simulator"]
    networks: [telemetry-net]
    environment:
      <<: *secure-client-env
      KAFKA_TLS_CERT_FILE: /etc/secure/simulator.crt
      KAFKA_TLS_KEY_FILE: /etc/secure/simulator.key
      KAFKA_SASL_USER: simulator
      KAFKA_SASL_PASSWORD_FILE: /etc/secure/simulator.password
      SCHEMA_REGISTRY_USER: simulator
      SCHEMA_REGISTRY_PASSWORD_FILE: /etc/secure/registry-simulator.password
      SIM_GREENHOUSES: ${SIM_GREENHOUSES:-20}
      SIM_RATE: ${SIM_RATE:-80}
    volumes:
      - ./.secure/simulator:/etc/secure:ro
    depends_on:
      init-secure: { condition: service_completed_successfully }
    restart: unless-stopped

  aggregator-secure:
    profiles: ["secure"]
    image: kafka-telemetry:local
    command: ["aggregator"]
    networks: [telemetry-net]
    environment:
      <<: *secure-client-env
      KAFKA_TLS_CERT_FILE: /etc/secure/aggregator.crt
      KAFKA_TLS_KEY_FILE: /etc/secure/aggregator.key
      KAFKA_SASL_USER: aggregator
      KAFKA_SASL_PASSWORD_FILE: /etc/secure/aggregator.password
      SCHEMA_REGISTRY_USER: aggregator
      SCHEMA_REGISTRY_PASSWORD_FILE: /etc/secure/registry-aggregator.password
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://telemetry:${POSTGRES_PASSWORD:-dev-only-change-me}@postgres:5432/telemetry
      OPERATOR_TOKENS: ${OPERATOR_TOKENS:-ana:dev-only-token-ana,bruno:dev-only-token-bruno}
      WINDOW_SIZE: ${WINDOW_SIZE:-1m}
    volumes:
      - ./.secure/aggregator:/etc/secure:ro
    ports:
      - "127.0.0.1:${AGGREGATOR_SECURE_PORT:-9112}:9102"
    depends_on:
      init-secure: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  notifier-secure:
    profiles: ["secure"]
    image: kafka-telemetry:local
    command: ["notifier"]
    networks: [telemetry-net]
    environment:
      <<: *secure-client-env
      KAFKA_TLS_CERT_FILE: /etc/secure/notifier.crt
      KAFKA_TLS_KEY_FILE: /etc/secure/notifier.key
      KAFKA_SASL_USER: notifier
      KAFKA_SASL_PASSWORD_FILE: /etc/secure/notifier.password
      SCHEMA_REGISTRY_USER: notifier
      SCHEMA_REGISTRY_PASSWORD_FILE: /etc/secure/registry-notifier.password
      REDIS_ADDR: redis:6379
      NOTIFY_RECIPIENTS_FILE: /etc/notifier/recipients.json
      NOTIFY_SMTP_ADDR: mailpit:1025
      NOTIFY_SMTP_FROM: alertas@example.com
    volumes:
      - ./.secure/notifier:/etc/secure:ro
      - ./deploy/notifier:/etc/notifier:ro
    depends_on:
      init-secure: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    restart: unless-stopped

  web:
    profiles: ["core"]
    build: ./web
    image: kafka-telemetry-web:local
    networks: [telemetry-net]
    ports:
      - "${WEB_PORT:-8088}:8080"
    depends_on:
      aggregator: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    networks: [telemetry-net]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Dashboards versionados em deploy/grafana (pipeline, SLOs e notificador).
  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.1
    networks: [telemetry-net]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-only-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.62.0
    networks: [telemetry-net]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    profiles: ["tools"]
    image: provectuslabs/kafka-ui:v0.7.2
    networks: [telemetry-net]
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: agrovale-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    depends_on:
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 15s
      retries: 20
